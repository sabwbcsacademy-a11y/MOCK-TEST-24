        { q: "41. ইউট্রোফিকেশন বা পুষ্টি-সমৃদ্ধির ফলে জলাশয়ে প্রধানত কী ঘটে?", options: ["(A) দ্রবীভূত অক্সিজেন বৃদ্ধি পায়", "(B) শৈবালের অতিরিক্ত বৃদ্ধি ঘটে", "(C) জলের লবণাক্ততা শূন্য হয়", "(D) জলের তাপমাত্রা স্থির থাকে"], ans: 1 },
        { q: "42. পিতা ও পুত্রের বর্তমান বয়সের অনুপাত 3 : 1। 10 বছর পরে তাদের বয়সের অনুপাত 2 : 1 হবে। পুত্রের বর্তমান বয়স কত?", options: ["(A) 8 বছর", "(B) 10 বছর", "(C) 12 বছর", "(D) 15 বছর"], ans: 1 },
        { q: "43. একটি নল 12 ঘণ্টায় এবং অন্য একটি নল 18 ঘণ্টায় একটি চৌবাচ্চা পূর্ণ করতে পারে। দুটি নল একসঙ্গে খুললে চৌবাচ্চাটি কত সময়ে পূর্ণ হবে?", options: ["(A) 6 ঘণ্টা", "(B) 7 ঘণ্টা 12 মিনিট", "(C) 8 ঘণ্টা", "(D) 9 ঘণ্টা"], ans: 1 },
        { q: "44. একটি ট্রেন ঘণ্টায় 60 কিমি বেগে 1 ঘণ্টা 30 মিনিট চললে মোট কত দূরত্ব অতিক্রম করবে?", options: ["(A) 80 কিমি", "(B) 85 কিমি", "(C) 90 কিমি", "(D) 100 কিমি"], ans: 2 },
        { q: "45. একটি পণ্যের ক্রয়মূল্য 800 টাকা এবং বিক্রয়মূল্য 920 টাকা হলে লাভের শতকরা হার কত?", options: ["(A) 12%", "(B) 15%", "(C) 18%", "(D) 20%"], ans: 1 },
        { q: "46. কোনো সংখ্যার 20% বৃদ্ধি করার পর নতুন সংখ্যাটির 20% হ্রাস করা হলে মূল সংখ্যার তুলনায় কত শতাংশ পরিবর্তন হবে?", options: ["(A) 2% বৃদ্ধি", "(B) 4% হ্রাস", "(C) 4% বৃদ্ধি", "(D) কোনো পরিবর্তন হবে না"], ans: 1 },
        { q: "47. 840 টাকা 3 : 4 : 5 অনুপাতে তিনজনের মধ্যে ভাগ করলে দ্বিতীয় ব্যক্তি কত টাকা পাবেন?", options: ["(A) 210 টাকা", "(B) 240 টাকা", "(C) 280 টাকা", "(D) 350 টাকা"], ans: 2 },
        { q: "49. প্রতি কেজি 20 টাকা ও 32 টাকা দরের দুটি চাল মিশিয়ে প্রতি কেজি 26 টাকা দরের মিশ্রণ তৈরি করা হলো। দুই ধরনের চালের পরিমাণের অনুপাত কত?", options: ["(A) 1 : 2", "(B) 2 : 1", "(C) 1 : 1", "(D) 3 : 2"], ans: 2 },
        { q: "50. একটি নৌকার অনুকূলে স্রোতের বেগ ঘণ্টায় 20 কিমি এবং প্রতিকূলে বেগ ঘণ্টায় 12 কিমি। স্থির জলে নৌকার বেগ কত?", options: ["(A) 14 কিমি/ঘণ্টা", "(B) 15 কিমি/ঘণ্টা", "(C) 16 কিমি/ঘণ্টা", "(D) 18 কিমি/ঘণ্টা"], ans: 2 }
    ];

    let timerInterval;
    let timeLeft = 40 * 60; // 40 minutes
    let studentData = {};

    function startQuiz(e) {
        e.preventDefault();
        
        const nameInput = document.getElementById('fullName').value.trim();
        const mobileInput = document.getElementById('mobileNum').value.trim();
        
        const nameError = document.getElementById('nameError');
        const mobileError = document.getElementById('mobileError');
        
        nameError.style.display = 'none';
        mobileError.style.display = 'none';
        
        // Regex: English and Bengali text + spaces only
        const nameRegex = /^[A-Za-z\u0980-\u09FF\s]+$/;
        // Regex: Exactly 10 digits
        const mobileRegex = /^[0-9]{10}$/;
        
        let valid = true;
        
        if (!nameRegex.test(nameInput)) {
            nameError.style.display = 'block';
            valid = false;
        }
        
        if (!mobileRegex.test(mobileInput)) {
            mobileError.style.display = 'block';
            valid = false;
        }
        
        if (!valid) return;
        
        studentData = { name: nameInput, mobile: mobileInput };
        
        document.getElementById('login-sec').classList.add('hidden');
        document.getElementById('quiz-sec').classList.remove('hidden');
        document.getElementById('candidate-name').innerText = nameInput;
        
        renderQuestions();
        startTimer();
    }

    function renderQuestions() {
        const container = document.getElementById('questions-container');
        container.innerHTML = '';
        
        quizData.forEach((q, index) => {
            const card = document.createElement('div');
            card.className = 'q-card';
            
            let optionsHTML = '';
            q.options.forEach((opt, optIdx) => {
                optionsHTML += `
                    <label class="option-label" id="opt-label-${index}-${optIdx}">
                        <input type="radio" name="q${index}" value="${optIdx}">
                        ${opt}
                    </label>
                `;
            });
            
            card.innerHTML = `
                <div class="q-title">${q.q}</div>
                <div>${optionsHTML}</div>
            `;
            container.appendChild(card);
        });
    }

    function startTimer() {
        timerInterval = setInterval(() => {
            timeLeft--;
            let mins = Math.floor(timeLeft / 60);
            let secs = timeLeft % 60;
            document.getElementById('timer').innerText = `Time Remaining: ${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
            
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                alert("Time is up! Submitting test automatically.");
                submitQuiz();
            }
        }, 1000);
    }

    function submitQuiz() {
        clearInterval(timerInterval);
        
        let score = 0;
        let correctCount = 0;
        let wrongCount = 0;
        
        quizData.forEach((q, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            if (selected) {
                const val = parseInt(selected.value);
                if (val === q.ans) {
                    score += 1;
                    correctCount++;
                } else {
                    score -= 0.25;
                    wrongCount++;
                }
            }
        });

        studentData.score = score;
        studentData.total = quizData.length;

        // Display results
        document.getElementById('quiz-sec').classList.add('hidden');
        document.getElementById('result-sec').classList.remove('hidden');
        document.getElementById('score-text').innerText = `Score: ${score} / ${quizData.length} (Correct: ${correctCount}, Wrong: ${wrongCount})`;

        // Preview answer key
        renderReview();

        // Send to Google Sheets
        sendDataToSheets();
    }

    function renderReview() {
        const reviewContainer = document.getElementById('review-container');
        reviewContainer.innerHTML = '';

        quizData.forEach((q, index) => {
            const selected = document.querySelector(`input[name="q${index}"]:checked`);
            const userAns = selected ? parseInt(selected.value) : -1;

            const card = document.createElement('div');
            card.className = 'q-card';

            let optionsHTML = '';
            q.options.forEach((opt, optIdx) => {
                let statusClass = '';
                
                if (optIdx === q.ans) {
                    statusClass = 'correct-ans'; // Highlight green for correct answer
                }
                if (userAns === optIdx && userAns !== q.ans) {
                    statusClass = 'wrong-ans'; // Highlight red for wrong selected attempt
                }

                optionsHTML += `
                    <div class="option-label ${statusClass}">
                        ${opt} ${optIdx === q.ans ? ' ✔ (Correct Answer)' : ''} ${userAns === optIdx && userAns !== q.ans ? ' ✖ (Your Choice)' : ''}
                    </div>
                `;
            });

            card.innerHTML = `
                <div class="q-title">${q.q}</div>
                <div>${optionsHTML}</div>
            `;
            reviewContainer.appendChild(card);
        });
    }

    function sendDataToSheets() {
        if (!SCRIPT_URL || SCRIPT_URL === "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL") {
            document.getElementById('sub-status').innerText = "Result calculated. (Google Sheets URL not configured)";
            return;
        }

        document.getElementById('sub-status').innerText = "Sending data to Google Sheet...";

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(studentData)
        })
        .then(() => {
            document.getElementById('sub-status').innerText = "Data successfully saved to Google Sheet!";
        })
        .catch(err => {
            console.error('Error:', err);
            document.getElementById('sub-status').innerText = "Failed to submit data to Google Sheet.";
        });
    }
</script>
